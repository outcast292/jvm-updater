plugins {
    id 'java-test-fixtures'
}

description = 'Signed manifests, release feeds and side-by-side staging for jvm-updater.'

jar {
    manifest {
        attributes 'Main-Class': 'io.github.outcast292.jvmupdater.cli.Main'
    }
}

// Test fixtures are for this build's tests, not for users of the library.
components.java.withVariantsFromConfiguration(configurations.testFixturesApiElements) { skip() }
components.java.withVariantsFromConfiguration(configurations.testFixturesRuntimeElements) { skip() }
